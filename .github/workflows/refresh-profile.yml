name: Refresh profile telemetry

on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - profile.json
      - scripts/update-profile.mjs
      - .github/workflows/refresh-profile.yml

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Refresh verified public GitHub data and graphics
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-profile.mjs
      - name: Commit refreshed assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md assets data/github.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh public GitHub profile telemetry"
            git push
          fi
