<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="282" viewBox="0 0 1000 282" role="img" aria-labelledby="title desc"><title id="title">project-02</title><desc id="desc">SATELLITE TILE SEGMENTATION. Pixel-wise segmentation of high-resolution aerial imagery with a residual U-Net and a dilated bottleneck. Patch extraction, test-time augmentation, and tile reconstruction. PYTHON · TENSORFLOW · KERAS · JUPYTER.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="282" fill="#ffffff" /><text x="48" y="28" font-size="10" fill="#626262" letter-spacing="2" >02 / REMOTE SENSING / DEEP LEARNING</text><text x="48" y="70" font-size="26" fill="#151515" letter-spacing="-.5">SATELLITE TILE SEGMENTATION</text><text x="946" y="31" font-size="10" fill="#626262" letter-spacing="2" text-anchor="end">VIEW REPOSITORY ↗</text><text x="48" y="110" font-size="15" fill="#151515" >Pixel-wise segmentation of high-resolution aerial imagery</text><text x="48" y="135" font-size="15" fill="#626262" >with a residual U-Net and a dilated bottleneck.</text><text x="48" y="160" font-size="15" fill="#626262" >Patch extraction, test-time augmentation, and tile reconstruction.</text><rect x="834" y="93" width="18" height="18" fill="#151515" /><rect x="856" y="93" width="18" height="18" fill="#cdcdcd" /><rect x="878" y="93" width="18" height="18" fill="#eeeeee" /><rect x="900" y="93" width="18" height="18" fill="#151515" /><rect x="834" y="115" width="18" height="18" fill="#cdcdcd" /><rect x="856" y="115" width=