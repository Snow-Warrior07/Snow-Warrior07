<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">whoami</title><desc id="desc">Electrical &amp; Electronics Engineering · IIT Patna · B.Tech 2023–2027. Minor in Business Studies · Expected graduation 2027. Power systems, mixed-signal design, controls and computer vision.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="300" fill="#ffffff" /><text x="48" y="34" font-size="17" fill="#151515" >Electrical &amp; Electronics Engineering · IIT Patna · B.Tech 2023–2027</text><text x="48" y="66" font-size="15" fill="#626262" >Minor in Business Studies · Expected graduation 2027</text><text x="48" y="112" font-size="16" fill="#151515" >I build circuits, fault-diagnosis tools, control systems and learning pipelines.</text><text x="48" y="144" font-size="14" fill="#626262" >Understand the model, test the assumptions, inspect the results.</text><line x1="48" y1="171" x2="952" y2="171" stroke="#cdcdcd" /><text x="48" y="207" font-size="11" fill="#626262" letter-spacing="2" >FOCUS</text><text x="180" y="207" font-size="14" fill="#151515" >Power systems · mixed-signal design · controls · computer vision</text><text x="48" y="241" font-size="11" fill="#626262" letter-spacing="2" >BUILDING</text><text x="180" y="241" font-size="14" fill="#151515" >GridFault Lab, SAR conversion and traction-aware autonomy</text><text x="48" y="275" font-size="11" fill="#626262" letter-spacing="2" >APPROACH</text><text x="180" y="275" font-size="14" fill="#151515" >Simulation · reproducible experiments · inspectable engineering</text></svg>
