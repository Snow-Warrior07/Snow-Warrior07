<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="330" viewBox="0 0 1000 330" role="img" aria-labelledby="title desc"><title id="title">telemetry</title><desc id="desc">Animated engineering loop: model, build, test, and inspect. The waveform is decorative, not a measurement.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="330" fill="#ffffff" /><text x="48" y="30" font-size="11" fill="#626262" letter-spacing="2" >TELEMETRY — THE ENGINEERING LOOP</text><text x="952" y="30" font-size="11" fill="#626262" letter-spacing="2" text-anchor="end">FIG. 02</text><rect x="48" y="74" width="208" height="82" fill="#ffffff" stroke="#cdcdcd"/><text x="66" y="103" font-size="10" fill="#626262" letter-spacing="2" >01</text><text x="66" y="135" font-size="19" fill="#151515" >MODEL</text><line x1="256" y1="114" x2="280" y2="114" stroke="#151515" class="flow"/><rect x="280" y="74" width="208" height="82" fill="#ffffff" stroke="#cdcdcd"/><text x="298" y="103" font-size="10" fill="#626262" letter-spacing="2" >02</text><text x="298" y="135" font-size="19" fill="#151515" >BUILD</text><line x1="488" y1="114" x2="512" y2="114" stroke="#151515" class="flow"/><rect x="512" y="74" width="208" height="82" fill="#ffffff" stroke="#cdcdcd"/><text x="530" y="103" font-size="10" fill="#626262" letter-spacing="2" >03</text><text x="530" y="135" font-size="19" fill="#151515" >TEST</text><line x1="720" y1="114" x2="744" y2="114" stroke="#151515" class="flow"/><rect x="744" y="74" width="208" height="82" fill="#ffffff" stroke="#cdcdcd"/><text x="762" y="103" font-size="10" fill="#626262" letter-spacing="2" >04</text><text x="762" y="135" font-size="19" fill="#151515" >INSPECT</text><line x1="48" y1="190" x2="952" y2="190" stroke="#cdcdcd" /><text x="48" y="221" font-size="11" fill="#626262" letter-spacing="2" >CURRENT FOCUS</text><text x="48" y="255" font-size="18" fill="#151515" >Traction-aware control</text><text x="48" y="284" font-size="18" fill="#151515" >and high-resolution learning.</text><text x="566" y="221" font-size="11" fill="#626262" letter-spacing="2" >FEEDBACK, ALWAYS</text><path d="M566 263 H620 L641 245 L660 278 L688 231 L712 285 L734 254 H765 L787 270 L811 242 L835 273 H952" fill="none" stroke="#151515" stroke-width="2"/><circle cx="845" cy="273" r="4" fill="#151515" class="pulse"/><rect x="700" y="233" width="1" height="57" fill="#cdcdcd" class="scan"/></svg>
