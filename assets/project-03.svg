<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="282" viewBox="0 0 1000 282" role="img" aria-labelledby="title desc"><title id="title">project-03</title><desc id="desc">VQ-VAE PATHOLOGY TRIAGE. A preprocessing gate for gigapixel pathology imagery. Memory-mapped tiling and VQ-VAE reconstruction error screen patches before expensive downstream segmentation. PYTHON · PYTORCH · VQ-VAE · ONNX.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="282" fill="#ffffff" /><text x="48" y="28" font-size="10" fill="#626262" letter-spacing="2" >03 / REPRESENTATION LEARNING / IMAGE QC</text><text x="48" y="70" font-size="26" fill="#151515" letter-spacing="-.5">VQ-VAE PATHOLOGY TRIAGE</text><text x="946" y="31" font-size="10" fill="#626262" letter-spacing="2" text-anchor="end">VIEW REPOSITORY ↗</text><text x="48" y="110" font-size="15" fill="#151515" >A preprocessing gate for gigapixel pathology imagery.</text><text x="48" y="135" font-size="15" fill="#626262" >Memory-mapped tiling and VQ-VAE reconstruction error</text><text x="48" y="160" font-size="15" fill="#626262" >screen patches before expensive downstream segmentation.</text><rect x="834" y="93" width="90" height="82" fill="#ffffff" stroke="#cdcdcd"/><line x1="848" y1="133" x2="873" y2="133" stroke="#151515" /><line x1="885" y1="133" x2="910" y2="133" stroke="#151515" /><circle cx="879" cy="133" r="7" fill="#151515" class="pulse"/><line x1="848" y1="113" x2="865" y2="126" stroke="#626262" /><line x1="848" y1="153" x2="865" y2="140" stroke="#626262" /><line x1="893" y1="126" x2="910" y2="113" stroke="#626262" /><line x1="893" y1="140" x2="910" y2="153" stroke="#626262" /><text x="48" y="201" font-size="12" fill="#626262" >Tiling → reconstruction → quality control → export</text><text x="48" y="235" font-size="10" fill="#626262" letter-spacing="2" >PYTHON · PYTORCH · VQ-VAE · ONNX</text><line x1="48" y1="261" x2="952" y2="261" stroke="#cdcdcd" /></svg>
