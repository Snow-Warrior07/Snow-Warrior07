<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="246" viewBox="0 0 1000 246" role="img" aria-labelledby="title desc"><title id="title">timeline</title><desc id="desc">GitHub account created February 2025. Stock and inventory repositories created May 2026. Vision repositories created September 2026. Robotics repository created October 2026.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="246" fill="#ffffff" /><text x="48" y="30" font-size="11" fill="#626262" letter-spacing="2" >THE ROUTE SO FAR — REPOSITORY MILESTONES</text><text x="952" y="30" font-size="11" fill="#626262" letter-spacing="2" text-anchor="end">FIG. 04</text><line x1="100" y1="105" x2="880" y2="105" stroke="#151515" class="flow"/><text x="100" y="80" font-size="11" fill="#151515" letter-spacing="2" text-anchor="middle">FEB 2025</text><circle cx="100" cy="105" r="5" fill="#ffffff" stroke="#151515" stroke-width="2" /><text x="100" y="145" font-size="14" fill="#151515" text-anchor="middle">GitHub begins</text><text x="100" y="174" font-size="11" fill="#626262" text-anchor="middle">First step into the open.</text><text x="360" y="80" font-size="11" fill="#151515" letter-spacing="2" text-anchor="middle">MAY 2026</text><circle cx="360" cy="105" r="5" fill="#ffffff" stroke="#151515" stroke-width="2" /><text x="360" y="145" font-size="14" fill="#151515" text-anchor="middle">Project scaffolds</text><text x="360" y="174" font-size="11" fill="#626262" text-anchor="middle">Stocks + inventory.</text><text x="620" y="80" font-size="11" fill="#151515" letter-spacing="2" text-anchor="middle">SEP 2026</text><circle cx="620" cy="105" r="5" fill="#ffffff" stroke="#151515" stroke-width="2" /><text x="620" y="145" font-size="14" fill="#151515" text-anchor="middle">Vision pipelines</text><text x="620" y="174" font-size="11" fill="#626262" text-anchor="middle">Satellite tiles + VQ-VAE.</text><text x="880" y="80" font-size="11" fill="#151515" letter-spacing="2" text-anchor="middle">OCT 2026</text><circle cx="880" cy="105" r="5" fill="#ffffff" stroke="#151515" stroke-width="2" class="pulse"/><text x="880" y="145" font-size="14" fill="#151515" text-anchor="middle">Autonomous systems</text><text x="880" y="174" font-size="11" fill="#626262" text-anchor="middle">Traction-aware rover.</text><text x="48" y="216" font-size="12" fill="#626262" >From early repositories to learning pipelines and virtual machines.</text></svg>
