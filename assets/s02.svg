<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="108" viewBox="0 0 1000 108" role="img" aria-labelledby="title desc"><title id="title">s02</title><desc id="desc">02 — system map</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="108" fill="#ffffff" /><text x="48" y="79" font-size="52" fill="#151515" letter-spacing="-3">02</text><text x="130" y="67" font-size="13" fill="#151515"  letter-spacing="4">SYSTEM MAP</text><line x1="350" y1="62" x2="825" y2="62" stroke="#151515" /><text x="952" y="67" font-size="10" fill="#626262" letter-spacing="2" text-anchor="end">~/02-system-map</text></svg>
