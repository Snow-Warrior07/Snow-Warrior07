<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="108" viewBox="0 0 1000 108" role="img" aria-labelledby="title desc"><title id="title">s06</title><desc id="desc">06 — stack</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="108" fill="#0d1117" /><text x="48" y="79" font-size="52" fill="#f0f0f0" letter-spacing="-3">06</text><text x="130" y="67" font-size="13" fill="#f0f0f0"  letter-spacing="4">STACK</text><line x1="350" y1="62" x2="825" y2="62" stroke="#f0f0f0" /><text x="952" y="67" font-size="10" fill="#a1a6ac" letter-spacing="2" text-anchor="end">~/06-stack</text></svg>
