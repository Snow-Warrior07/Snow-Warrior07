<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="282" viewBox="0 0 1000 282" role="img" aria-labelledby="title desc"><title id="title">project-01</title><desc id="desc">TRACTION-AWARE AMR. A virtual warehouse rover with friction-limited dynamics, linear and nonlinear tracking, and traction supervision. ROS 2 integration, a Pico carrier PCB, and reproducible tests. PYTHON · C++ · ROS 2 · GAZEBO · KICAD.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="282" fill="#0d1117" /><text x="48" y="28" font-size="10" fill="#a1a6ac" letter-spacing="2" >01 / ROBOTICS / CONTROL</text><text x="48" y="70" font-size="26" fill="#f0f0f0" letter-spacing="-.5">TRACTION-AWARE AMR</text><text x="946" y="31" font-size="10" fill="#a1a6ac" letter-spacing="2" text-anchor="end">VIEW REPOSITORY ↗</text><text x="48" y="110" font-size="15" fill="#f0f0f0" >A virtual warehouse rover with friction-limited dynamics,</text><text x="48" y="135" font-size="15" fill="#a1a6ac" >linear and nonlinear tracking, and traction supervision.</text><text x="48" y="160" font-size="15" fill="#a1a6ac" >ROS 2 integration, a Pico carrier PCB, and reproducible tests.</text><rect x="834" y="112" width="80" height="53" fill="#0d1117" stroke="#343b44"/><circle cx="847" cy="170" r="9" fill="#0d1117" stroke="#f0f0f0"/><circle cx="901" cy="170" r="9" fill="#0d1117" stroke="#f0f0f0"/><line x1="874" y1="112" x2="874" y2="93" stroke="#343b44" /><circle cx="874" cy="90" r="5" fill="#f0f0f0" /><line x1="850" y1="137" x2="862" y2="137" stroke="#f0f0f0" /><line x1="886" y1="137" x2="898" y2="137" stroke="#f0f0f0" /><text x="48" y="201" font-size="12" fill="#a1a6ac" >4 controller variants · 540-run experiment matrix</text><text x="48" y="235" font-size="10" fill="#a1a6ac" letter-spacing="2" >PYTHON · C++ · ROS 2 · GAZEBO · KICAD</text><line x1="48" y1="261" x2="952" y2="261" stroke="#343b44" /></svg>
