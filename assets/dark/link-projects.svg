<svg xmlns="http://www.w3.org/2000/svg" width="120" height="40" viewBox="0 0 120 40" role="img" aria-labelledby="title desc"><title id="title">link-projects</title><desc id="desc">PROJECTS</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="120" height="40" fill="#0d1117" /><text x="60" y="26" font-size="13" fill="#f0f0f0" text-anchor="middle" letter-spacing="1">PROJECTS</text></svg>
