<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="250" viewBox="0 0 1000 250" role="img" aria-labelledby="title desc"><title id="title">whoami</title><desc id="desc">About Abhitesh: robotics, control engineering, computer vision, and representation learning.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="250" fill="#0d1117" /><text x="48" y="34" font-size="17" fill="#f0f0f0" >I build at the intersection of intelligent machines and visual data.</text><text x="48" y="66" font-size="16" fill="#f0f0f0" >Control loops for autonomous robots. Learning pipelines for large images.</text><text x="48" y="100" font-size="14" fill="#a1a6ac" >The common thread: understand the model, test the assumptions, inspect the results.</text><line x1="48" y1="130" x2="952" y2="130" stroke="#343b44" /><text x="48" y="168" font-size="11" fill="#a1a6ac" letter-spacing="2" >FOCUS</text><text x="180" y="168" font-size="14" fill="#f0f0f0" >Robotics · control engineering · computer vision · representation learning</text><text x="48" y="202" font-size="11" fill="#a1a6ac" letter-spacing="2" >BUILDING</text><text x="180" y="202" font-size="14" fill="#f0f0f0" >Traction-aware autonomy and efficient high-resolution image pipelines</text><text x="48" y="236" font-size="11" fill="#a1a6ac" letter-spacing="2" >APPROACH</text><text x="180" y="236" font-size="14" fill="#f0f0f0" >Simulation · reproducible experiments · inspectable engineering</text></svg>
