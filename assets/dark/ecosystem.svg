<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="630" viewBox="0 0 1000 630" role="img" aria-labelledby="title desc"><title id="title">ecosystem</title><desc id="desc">Three project tracks connect robotics, satellite vision, and VQ-VAE representation learning through reproducible experimentation.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="630" fill="#0d1117" /><text x="48" y="30" font-size="11" fill="#a1a6ac" letter-spacing="2" >SYSTEM MAP — ONE ENGINEERING MINDSET</text><text x="952" y="30" font-size="11" fill="#a1a6ac" letter-spacing="2" text-anchor="end">FIG. 01</text><rect x="335" y="70" width="330" height="95" fill="#0d1117" stroke="#343b44"/><text x="500" y="107" font-size="18" fill="#f0f0f0" letter-spacing="2" text-anchor="middle">ABHITESH.SYS</text><text x="500" y="137" font-size="13" fill="#a1a6ac" text-anchor="middle">model → build → measure</text><line x1="500" y1="165" x2="500" y2="202" stroke="#343b44" /><line x1="190" y1="202" x2="810" y2="202" stroke="#343b44" /><line x1="190" y1="202" x2="190" y2="249" stroke="#f0f0f0" class="flow"/><circle cx="190" cy="202" r="4" fill="#f0f0f0" /><text x="190" y="243" font-size="11" fill="#a1a6ac" letter-spacing="2" text-anchor="middle">AUTONOMY</text><rect x="51" y="265" width="278" height="170" fill="#0d1117" stroke="#343b44"/><text x="190" y="303" font-size="15" fill="#f0f0f0" text-anchor="middle">traction-aware-amr</text><text x="190" y="331" font-size="13" fill="#a1a6ac" text-anchor="middle">motion + estimation</text><line x1="71" y1="352" x2="309" y2="352" stroke="#343b44" /><text x="190" y="382" font-size="11" fill="#f0f0f0" text-anchor="middle">PI / LQR / nonlinear control</text><text x="190" y="408" font-size="11" fill="#a1a6ac" text-anchor="middle">ROS 2 + simulation + PCB</text><line x1="190" y1="435" x2="190" y2="475" stroke="#f0f0f0" class="flow"/><line x1="500" y1="202" x2="500" y2="249" stroke="#f0f0f0" class="flow"/><circle cx="500" cy="202" r="4" fill="#f0f0f0" /><text x="500" y="243" font-size="11" fill="#a1a6ac" letter-spacing="2" text-anchor="middle">VISION</text><rect x="361" y="265" width="278" height="170" fill="#0d1117" stroke="#343b44"/><text x="500" y="303" font-size="15" fill="#f0f0f0" text-anchor="middle">satellite segmentation</text><text x="500" y="331" font-size="13" fill="#a1a6ac" text-anchor="middle">pixels + context</text><line x1="381" y1="352" x2="619" y2="352" stroke="#343b44" /><text x="500" y="382" font-size="11" fill="#f0f0f0" text-anchor="middle">Residual U-Net + dilations</text><text x="500" y="408" font-size="11" fill="#a1a6ac" text-anchor="middle">patches + TTA + reconstruction</text><line x1="500" y1="435" x2="500" y2="475" stroke="#f0f0f0" class="flow"/><line x1="810" y1="202" x2="810" y2="249" stroke="#f0f0f0" class="flow"/><circle cx="810" cy="202" r="4" fill="#f0f0f0" /><text x="810" y="243" font-size="11" fill="#a1a6ac" letter-spacing="2" text-anchor="middle">REPRESENTATIONS</text><rect x="671" y="265" width="278" height="170" fill="#0d1117" stroke="#343b44"/><text x="810" y="303" font-size="15" fill="#f0f0f0" text-anchor="middle">VAE-Triage</text><text x="810" y="331" font-size="13" fill="#a1a6ac" text-anchor="middle">compression + quality</text><line x1="691" y1="352" x2="929" y2="352" stroke="#343b44" /><text x="810" y="382" font-size="11" fill="#f0f0f0" text-anchor="middle">VQ-VAE + anomaly scoring</text><text x="810" y="408" font-size="11" fill="#a1a6ac" text-anchor="middle">memory-mapped tiles + ONNX</text><line x1="810" y1="435" x2="810" y2="475" stroke="#f0f0f0" class="flow"/><line x1="190" y1="475" x2="810" y2="475" stroke="#343b44" /><line x1="500" y1="475" x2="500" y2="506" stroke="#f0f0f0" class="flow"/><rect x="250" y="506" width="500" height="61" fill="#0d1117" stroke="#343b44"/><text x="500" y="543" font-size="13" fill="#f0f0f0" letter-spacing="2" text-anchor="middle">SIMULATE · TRAIN · EVALUATE · REPEAT</text><circle cx="292" cy="598" r="3" fill="#f0f0f0" class="pulse"/><text x="310" y="602" font-size="10" fill="#a1a6ac" letter-spacing="2" >DASHED LINES — IDEAS IN MOTION</text></svg>
