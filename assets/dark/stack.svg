<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="295" viewBox="0 0 1000 295" role="img" aria-labelledby="title desc"><title id="title">stack</title><desc id="desc">Technologies evidenced in the three featured repositories: Python, C++, PyTorch, TensorFlow, Keras, ROS 2, Gazebo, KiCad, ngspice, NumPy, ONNX, Jupyter, GitHub Actions, and pytest.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="295" fill="#0d1117" /><text x="48" y="34" font-size="11" fill="#a1a6ac" letter-spacing="2" >LANGUAGES</text><text x="195" y="34" font-size="15" fill="#f0f0f0" >Python · C++</text><line x1="48" y1="53" x2="952" y2="53" stroke="#232a33" /><text x="48" y="78" font-size="11" fill="#a1a6ac" letter-spacing="2" >LEARNING</text><text x="195" y="78" font-size="15" fill="#f0f0f0" >PyTorch · TensorFlow · Keras · VQ-VAE · residual U-Net</text><line x1="48" y1="97" x2="952" y2="97" stroke="#232a33" /><text x="48" y="122" font-size="11" fill="#a1a6ac" letter-spacing="2" >ROBOTICS</text><text x="195" y="122" font-size="15" fill="#f0f0f0" >ROS 2 · Gazebo · PI / LQR · nonlinear tracking</text><line x1="48" y1="141" x2="952" y2="141" stroke="#232a33" /><text x="48" y="166" font-size="11" fill="#a1a6ac" letter-spacing="2" >HARDWARE</text><text x="195" y="166" font-size="15" fill="#f0f0f0" >KiCad · ngspice · Raspberry Pi Pico carrier design</text><line x1="48" y1="185" x2="952" y2="185" stroke="#232a33" /><text x="48" y="210" font-size="11" fill="#a1a6ac" letter-spacing="2" >COMPUTE</text><text x="19