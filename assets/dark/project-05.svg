<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="282" viewBox="0 0 1000 282" role="img" aria-labelledby="title desc"><title id="title">project-05</title><desc id="desc">8-BIT SAR ADC. Differential SAR conversion with a verified RTL controller. Online SKY130 circuit tests and a calibrated analog model. Static linearity, coherent FFTs and mapped digital timing. SYSTEMVERILOG · PYTHON · NGSPICE · SKY130 · YOSYS.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="282" fill="#0d1117" /><text x="48" y="28" font-size="10" fill="#a1a6ac" letter-spacing="2" >05 / MIXED-SIGNAL / RTL</text><text x="48" y="70" font-size="26" fill="#f0f0f0" letter-spacing="-.5">8-BIT SAR ADC</text><text x="946" y="31" font-size="10" fill="#a1a6ac" letter-spacing="2" text-anchor="end">VIEW REPOSITORY ↗</text><text x="48" y="110" font-size="15" fill="#f0f0f0" >Differential SAR conversion with a verified RTL controller.</text><text x="48" y="135" font-size="15" fill="#a1a6ac" >Online SKY130 circuit tests and a calibrated analog model.</text><text x="48" y="160" font-size="15" fill="#a1a6ac" >Static linearity, coherent FFTs and mapped digital timing.</text><rect x="842" y="93" width="72" height="82" fill="#0d1117" stroke="#343b44"/><line x1="826" y1="105" x2="842" y2="105" stroke="#f0f0f0" /><line x1="914" y1="105" x2="930" y2="105" stroke="#f0f0f0" /><line x1="826" y1="123" x2="842" y2="123" stroke="#f0f0f0" /><line x1="914" y1="123" x2="930" y2="123" stroke="#f0f0f0" /><line x1="826" y1="141" x2="842" y2="141" stroke="#f0f0f0" /><line x1="914" y1="141" x2="930" y2="141" stroke="#f0f0f0" /><line x1="826" y1="159" x2="842" y2="159" stroke="#f0f0f0" /><line x1="914" y1="159" x2="930" y2="159" stroke="#f0f0f0" /><text x="878" y="131" font-size="13" fill="#f0f0f0" letter-spacing="2" text-anchor="middle">SAR</text><text x="878" y="153" font-size="12" fill="#a1a6ac" text-anchor="middle">8 BIT</text><text x="48" y="201" font-size="12" fill="#a1a6ac" >8 bits · 100 kS/s model · 7.89 simulated ENOB</text><text x="48" y="235" font-size="10" fill="#a1a6ac" letter-spacing="2" >SYSTEMVERILOG · PYTHON · NGSPICE · SKY130 · YOSYS</text><line x1="48" y1="261" x2="952" y2="261" stroke="#343b44" /></svg>
