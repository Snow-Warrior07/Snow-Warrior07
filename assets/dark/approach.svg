<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="345" viewBox="0 0 1000 345" role="img" aria-labelledby="title desc"><title id="title">approach</title><desc id="desc">Project-based engineering approach: model the dynamics, respect image scale, and inspect the learning pipeline.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="345" fill="#0d1117" /><text x="48" y="30" font-size="11" fill="#a1a6ac" letter-spacing="2" >HOW I BUILD</text><text x="952" y="30" font-size="11" fill="#a1a6ac" letter-spacing="2" text-anchor="end">MODEL → EVIDENCE</text><text x="48" y="86" font-size="11" fill="#f0f0f0" letter-spacing="2" >CONTROL</text><text x="196" y="86" font-size="17" fill="#f0f0f0" >Start with the dynamics.</text><text x="196" y="115" font-size="13" fill="#a1a6ac" >Simulate contact and sensors; compare controller variants under matched conditions.</text><line x1="48" y1="142" x2="952" y2="142" stroke="#343b44" /><text x="48" y="186" font-size="11" fill="#f0f0f0" letter-spacing="2" >VISION</text><text x="196" y="186" font-size="17" fill="#f0f0f0" >Respect the scale of the data.</text><text x="196" y="215" font-size="13" fill="#a1a6ac" >Tile large images; build multiscale features; reconstruct full-resolution predictions.</text><line x1="48" y1="242" x2="952" y2="242" stroke="#343b44" /><text x="48" y="286" font-size="11" fill="#f0f0f0" letter-spacing="2" >LEARNING</text><text x="196" y="286" font-size="17" fill="#f0f0f0" >Make the pipeline inspectable.</text><text x="196" y="315" font-size="13" fill="#a1a6ac" >Train representations; examine reconstruction errors; export models for inference.</text></svg>
