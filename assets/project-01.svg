<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="282" viewBox="0 0 1000 282" role="img" aria-labelledby="title desc"><title id="title">project-01</title><desc id="desc">GRIDFAULT LAB. Transmission-line fault diagnosis from RMS and phasor measurements. Random Forest, ANFIS and a two-ended electrical locator. Browser inference with input checks, uncertainty and abstention. PYTHON · SCIKIT-LEARN · ANFIS · JAVASCRIPT · NUMPY.</desc><style>text{font-family:'SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace} .flow{stroke-dasharray:5 9;animation:flow 12s linear infinite} .pulse{animation:pulse 3s ease-in-out infinite} .scan{animation:scan 6s ease-in-out infinite} @keyframes flow{to{stroke-dashoffset:-140}} @keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}} @keyframes scan{0%,100%{transform:translateX(0)}50%{transform:translateX(125px)}} @media(prefers-reduced-motion:reduce){.flow,.pulse,.scan{animation:none}}</style><rect x="0" y="0" width="1000" height="282" fill="#ffffff" /><text x="48" y="28" font-size="10" fill="#626262" letter-spacing="2" >01 / POWER SYSTEMS / MACHINE LEARNING</text><text x="48" y="70" font-size="26" fill="#151515" letter-spacing="-.5">GRIDFAULT LAB</text><text x="946" y="31" font-size="10" fill="#626262" letter-spacing="2" text-anchor="end">VIEW REPOSITORY ↗</text><text x="48" y="110" font-size="15" fill="#151515" >Transmission-line fault diagnosis from RMS and phasor measurements.</text><text x="48" y="135" font-size="15" fill="#626262" >Random Forest, ANFIS and a two-ended electrical locator.</text><text x="48" y="160" font-size="15" fill="#626262" >Browser inference with input checks, uncertainty and abstention.</text><rect x="834" y="93" width="90" height="82" fill="#ffffff" stroke="#cdcdcd"/><path d="M844 111 h15 l8 -8 l12 16 l10 -8 h25" fill="none" stroke="#151515" stroke-width="1.5"/><path d="M844 134 h15 l8 -8 l12 16 l10 -8 h25" fill="none" stroke="#626262" stroke-width="1.5"/><path d="M844 157 h15 l8 -8 l12 16 l10 -8 h25" fill="none" stroke="#626262" stroke-width="1.5"/><text x="48" y="201" font-size="12" fill="#626262" >4 measurement profiles · 10 fault types · synthetic benchmark</text><text x="48" y="235" font-size="10" fill="#626262" letter-spacing="2" >PYTHON · SCIKIT-LEARN · ANFIS · JAVASCRIPT · NUMPY</text><line x1="48" y1="261" x2="952" y2="261" stroke="#cdcdcd" /></svg>
